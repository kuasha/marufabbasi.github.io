<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08111f">
    <link rel="preconnect" href="https://github.com">
    {% seo %}
    <style>
      :root {
        --bg: #08111f;
        --bg-2: #111827;
        --text: #f8fbff;
        --muted: #b8c4d9;
        --line: rgba(255, 255, 255, 0.18);
        --panel: rgba(255, 255, 255, 0.1);
        --panel-strong: rgba(255, 255, 255, 0.16);
        --shadow: 0 26px 80px rgba(0, 0, 0, 0.38);
        --cyan: #42d9c8;
        --rose: #ff6aa2;
        --amber: #f6c85f;
        --blue: #7aa7ff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
        background:
          linear-gradient(125deg, rgba(66, 217, 200, 0.22) 0 18%, transparent 18% 100%),
          linear-gradient(36deg, transparent 0 52%, rgba(255, 106, 162, 0.2) 52% 72%, transparent 72% 100%),
          linear-gradient(158deg, transparent 0 8%, rgba(122, 167, 255, 0.2) 8% 22%, transparent 22% 100%),
          linear-gradient(145deg, #08111f 0%, #14243a 48%, #23162f 100%);
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent 78%);
      }

      a {
        color: inherit;
      }

      .site-shell {
        position: relative;
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 28px 0 56px;
      }

      .site-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 56px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        font-weight: 800;
      }

      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(18px);
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .nav-links a,
      .pill-link {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        text-decoration: none;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
      }

      .nav-links a:hover,
      .pill-link:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.34);
        background: rgba(255, 255, 255, 0.15);
      }

      main {
        display: block;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
        gap: 28px;
        align-items: stretch;
      }

      .single-hero {
        grid-template-columns: minmax(0, 820px);
        justify-content: center;
      }

      .glass {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(145deg, var(--panel-strong), rgba(255, 255, 255, 0.055));
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(26px) saturate(142%);
      }

      .hero-copy {
        padding: clamp(28px, 5vw, 56px);
        overflow: hidden;
      }

      .hero-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(28px, 5vw, 58px);
        overflow: hidden;
        text-align: center;
      }

      .hero-copy::after,
      .hero-card::after,
      .profile-panel::after {
        content: "";
        position: absolute;
        width: 210px;
        height: 210px;
        right: -72px;
        top: -70px;
        background: linear-gradient(135deg, rgba(66, 217, 200, 0.32), rgba(246, 200, 95, 0.18));
        filter: blur(2px);
        transform: rotate(18deg);
        opacity: 0.72;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 24px;
        color: var(--cyan);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 28px;
        height: 2px;
        background: var(--cyan);
      }

      .hero h1 {
        position: relative;
        z-index: 1;
        max-width: 760px;
        margin: 0;
        font-size: clamp(3rem, 8vw, 6.7rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .hero-card h1 {
        margin-top: 28px;
      }

      .lead {
        position: relative;
        z-index: 1;
        max-width: 680px;
        margin: 26px 0 0;
        color: var(--muted);
        font-size: clamp(1.1rem, 2vw, 1.36rem);
        line-height: 1.65;
      }

      .hero-card .lead {
        margin-left: auto;
        margin-right: auto;
      }

      .actions {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      .hero-card .actions {
        justify-content: center;
      }

      .pill-link.primary {
        border-color: rgba(66, 217, 200, 0.55);
        color: #06131f;
        background: linear-gradient(135deg, var(--cyan), #b7fff3);
        font-weight: 800;
      }

      .profile-panel {
        min-height: 100%;
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }

      .portrait-wrap {
        position: relative;
        z-index: 1;
        width: 100%;
        min-height: 338px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
      }

      .hero-card .portrait-wrap {
        width: min(230px, 58vw);
        min-height: 0;
        aspect-ratio: 1;
        border-radius: 50%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      }

      .portrait-wrap img {
        width: 100%;
        height: 100%;
        min-height: 338px;
        display: block;
        object-fit: cover;
        object-position: center;
        filter: saturate(0.92) contrast(1.04);
      }

      .hero-card .portrait-wrap img {
        min-height: 0;
        aspect-ratio: 1;
      }

      .profile-meta {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }

      .hero-card .profile-meta {
        width: min(100%, 620px);
        margin-top: 30px;
      }

      .metric {
        padding: 15px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(4, 11, 21, 0.28);
      }

      .metric strong {
        display: block;
        font-size: 1.05rem;
      }

      .metric span {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.35;
      }

      .section {
        margin-top: 28px;
        padding: clamp(22px, 4vw, 34px);
      }

      .section h2 {
        margin: 0 0 18px;
        font-size: clamp(1.45rem, 3vw, 2.15rem);
        letter-spacing: 0;
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .project-card {
        min-height: 222px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.075);
        text-decoration: none;
      }

      .project-card h3 {
        margin: 0 0 12px;
        font-size: 1.22rem;
      }

      .project-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.58;
      }

      .project-card span {
        margin-top: 22px;
        color: var(--cyan);
        font-weight: 800;
      }

      .link-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .link-row a {
        min-height: 86px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.075);
        text-decoration: none;
        font-weight: 800;
      }

      .link-row a::after {
        content: "->";
        color: var(--amber);
      }

      main > h1,
      main > h2,
      main > h3,
      main > p,
      main > ul,
      main > ol,
      main > blockquote,
      main > table {
        max-width: 780px;
      }

      main > h1,
      main > h2,
      main > h3 {
        color: var(--text);
      }

      main > p,
      main > ul,
      main > ol,
      main > blockquote,
      main > table,
      .page-content {
        color: var(--muted);
        line-height: 1.7;
      }

      .page-content h1,
      .page-content h2,
      .page-content h3 {
        color: var(--text);
      }

      footer {
        margin-top: 28px;
        color: rgba(248, 251, 255, 0.62);
        font-size: 0.9rem;
      }

      @media (max-width: 880px) {
        .site-shell {
          width: min(100% - 28px, 680px);
          padding-top: 18px;
        }

        .site-nav,
        .nav-links {
          align-items: stretch;
        }

        .site-nav {
          flex-direction: column;
          margin-bottom: 24px;
        }

        .nav-links {
          display: grid;
          width: 100%;
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .hero,
        .project-grid,
        .link-row {
          grid-template-columns: 1fr;
        }

        .profile-panel {
          min-height: auto;
        }

        .portrait-wrap,
        .portrait-wrap img {
          min-height: 280px;
        }
      }

      @media (max-width: 520px) {
        .site-shell {
          width: min(100% - 20px, 480px);
        }

        .nav-links {
          grid-template-columns: 1fr;
        }

        .hero-copy,
        .section {
          padding: 22px;
        }

        .profile-meta {
          grid-template-columns: 1fr;
        }

        .hero h1 {
          font-size: clamp(2.65rem, 18vw, 4.25rem);
        }
      }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Maruf Abbasi home">
          <span class="brand-mark">MA</span>
          <span>Maruf Abbasi</span>
        </a>
        <div class="nav-links">
          <a href="https://github.com/marufabbasi/">GitHub</a>
          <a href="https://www.linkedin.com/in/kuasha/">LinkedIn</a>
          <a href="{{ '/resume.pdf' | relative_url }}">Resume</a>
        </div>
      </nav>

      <main>
        {{ content }}
      </main>

      <footer>
        marufabbasi.com
      </footer>
    </div>

    {% if site.google_analytics %}
      <script async src="https://www.googletagmanager.com/gtag/js?id=UA-118781323-1"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'UA-118781323-1');
      </script>
    {% endif %}
  </body>
</html>
